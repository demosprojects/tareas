<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="estilo.css">
  <link rel="icon" type="image/png" href="logo2-.png">
  <meta name="theme-color" content="#5e0d7e">
  <title>Tareas</title>
</head>
<body>
  <!-- Pantalla de clave -->
  <div id="clave-screen">
    <h2>Ingresá la clave para acceder</h2>
    <input type="password" id="clave-input" placeholder="Clave de acceso">
    <button id="validar-clave">Ingresar</button>
  </div>

  <!-- Contenedor principal oculto hasta validar clave -->
  <div class="contenedor" id="contenedor" style="display: none;">
    <h1>Tareas pendientes:</h1>
    <ul class="lista-tareas" id="lista-tareas"></ul>
    <input type="text" id="nueva-tarea" placeholder="Agregar nueva tarea">
    <button id="agregar-tarea-btn">Agregar tarea</button>
    <button id="restablecer-tareas">Borrar tarea</button>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
